*> Database configuration

set db_host = localhost
set db_port = 5432
set db_name = myapp

set connection_pool = [
    min_size => 5,
    max_size => 20,
    timeout => 30
]

set allowed_ips = { 192, 168, 1, 100 }

set features = [
    caching => enabled,
    logging => verbose,
    compression => gzip
]
