*> Example with constant evaluation

set default_port = 8080
set default_host = localhost
set default_timeout = 30

set primary_server = [
    host => #(default_host),
    port => #(default_port),
    timeout => #(default_timeout)
]

set backup_port = 8081

set backup_server = [
    host => #(default_host),
    port => #(backup_port),
    timeout => #(default_timeout)
]

set allowed_methods = { GET, POST, PUT, DELETE }

set server_config = [
    primary => #(primary_server),
    backup => #(backup_server),
    methods => #(allowed_methods),
    max_connections => 100
]
